# Monta o instalavel do Asa Edit para Mac (Apple Silicon), testa o app empacotado
# contra o emulador da WING e publica o .dmg numa release.
#
# Dispara a cada push na main e pelo botao "Run workflow" nesta tela do
# Actions. A release tem o nome da versao do package.json (ex.: v0.2.0) e e'
# atualizada a cada push enquanto a versao nao muda: o link de download e'
# sempre o da versao mais nova. Para uma versao nova, suba o "version".

name: Mac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Testes do protocolo e das snapshots
        run: npm test
      - name: Conferir tipos da interface
        run: npx tsc -p ui/tsconfig.json
      - name: Montar a interface
        run: npm run build:ui

  mac:
    needs: testar
    # macos-latest e' Apple Silicon, a mesma arquitetura do .dmg.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci
      - name: Montar a interface e o .dmg
        run: npm run mac

      # Abre o app de dentro do .dmg, como o Pedro abriria, e conecta no
      # emulador da WING (a Mesa de Playback, que vem junto no repositorio).
      - name: Testar o app empacotado
        run: |
          (cd emulador && MESA_SINAL_TESTE=1 node server.js > ../emulador.log 2>&1 &)
          sleep 3
          dmg="$(ls dist/*.dmg | head -1)"
          hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/asa >/dev/null
          "/Volumes/asa/Asa Edit.app/Contents/MacOS/Asa Edit" > app.log 2>&1 &
          app=$!
          ok=0
          node scripts/teste-fumaca.js 127.0.0.1 && ok=1
          kill $app 2>/dev/null || true
          hdiutil detach /Volumes/asa >/dev/null || true
          if [ $ok != 1 ]; then
            echo "--- app.log"; cat app.log || true
            echo "--- emulador.log"; tail -50 emulador.log || true
            echo "o app empacotado nao funcionou"; exit 1
          fi

      - name: Guardar o .dmg
        uses: actions/upload-artifact@v4
        with:
          name: asa-mac-arm64
          path: dist/*.dmg

  publicar:
    needs: mac
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asa-mac-arm64
          path: saida
      - name: Preparar a versao e as notas
        run: |
          versao="$(node -p "require('./package.json').version")"
          echo "TAG=v$versao" >> "$GITHUB_ENV"
          notas=".github/notas/v$versao.md"
          if [ -f "$notas" ]; then
            titulo="$(head -n 1 "$notas" | sed -n 's/^# //p')"
            echo "TITULO=${titulo:-Asa Edit $versao}" >> "$GITHUB_ENV"
            if [ -n "$titulo" ]; then tail -n +2 "$notas" > corpo.md; else cp "$notas" corpo.md; fi
          else
            echo "TITULO=Asa Edit $versao" >> "$GITHUB_ENV"
            echo "Instalável do Asa Edit para Mac (Apple Silicon)." > corpo.md
          fi
          printf '\n\n---\nMontado a partir de %s.\n' "${GITHUB_SHA::7}" >> corpo.md
          # A tag da versao acompanha o commit mais novo desta versao.
          git tag -f "v$versao"
          git push -f origin "refs/tags/v$versao"
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITULO }}
          body_path: corpo.md
          files: saida/*.dmg
          make_latest: true
