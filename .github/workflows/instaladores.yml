# Monta os instalaveis do Asa Edit: .dmg para Mac (Apple Silicon) e .apk para
# Android (tablet). Testa cada um contra o emulador da WING (o .dmg num Mac, o
# .apk num Android emulado) e publica os dois na release da versao.
#
# Dispara a cada push na main e pelo botao "Run workflow" nesta tela do
# Actions. A release tem o nome da versao do package.json (ex.: v0.2.0) e e'
# atualizada a cada push enquanto a versao nao muda: o link de download e'
# sempre o da versao mais nova. Para uma versao nova, suba o "version".

name: Instaladores

on:
  push:
    # Na branch de trabalho monta e testa, mas so publica a partir da main.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Testes do protocolo e das snapshots
        run: npm test
      - name: Conferir tipos da interface
        run: npx tsc -p ui/tsconfig.json
      - name: Montar a interface
        run: npm run build:ui

  mac:
    needs: testar
    # macos-latest e' Apple Silicon, a mesma arquitetura do .dmg.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci
      - name: Montar a interface e o .dmg
        run: npm run mac

      # Abre o app de dentro do .dmg, como o Pedro abriria, e conecta no
      # emulador da WING (a Mesa de Playback, que vem junto no repositorio).
      - name: Testar o app empacotado
        run: |
          (cd emulador && MESA_SINAL_TESTE=1 node server.js > ../emulador.log 2>&1 &)
          sleep 3
          dmg="$(ls dist/*.dmg | head -1)"
          hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/asa >/dev/null
          "/Volumes/asa/Asa Edit.app/Contents/MacOS/Asa Edit" > app.log 2>&1 &
          app=$!
          ok=0
          node scripts/teste-fumaca.js 127.0.0.1 && ok=1
          kill $app 2>/dev/null || true
          hdiutil detach /Volumes/asa >/dev/null || true
          if [ $ok != 1 ]; then
            echo "--- app.log"; cat app.log || true
            echo "--- emulador.log"; tail -50 emulador.log || true
            echo "o app empacotado nao funcionou"; exit 1
          fi

      - name: Guardar o .dmg
        uses: actions/upload-artifact@v4
        with:
          name: asa-mac-arm64
          path: dist/*.dmg

  android:
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Montar a interface
        run: npm run build:ui
      - name: Preparar o projeto Android (servidor, interface e Node para Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/preparar-android.sh
      # Com o segredo ANDROID_KEYSTORE_BASE64 (e ANDROID_KEYSTORE_SENHA), o APK
      # sai assinado com a chave guardada no GitHub; sem ele, com a do repositorio.
      - name: Chave de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/asa.keystore"
            echo "ASA_KEYSTORE=$RUNNER_TEMP/asa.keystore" >> "$GITHUB_ENV"
            echo "ASA_KEYSTORE_SENHA=$SENHA" >> "$GITHUB_ENV"
          fi
      - name: Montar o .apk
        run: |
          export ANDROID_NDK_VERSAO="$(basename "${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}")"
          echo "NDK: $ANDROID_NDK_VERSAO"
          versao="$(node -p "require('./package.json').version")"
          codigo="$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")"
          gradle -p android assembleRelease -PversaoNome="$versao" -PversaoCodigo="$codigo" --no-daemon --stacktrace
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Asa Edit $versao.apk"
          ls -la dist
      - name: Guardar o .apk
        uses: actions/upload-artifact@v4
        with:
          name: asa-android
          path: dist/*.apk

  android-teste:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: asa-android
          path: dist
      - name: Ligar a aceleracao do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Subir o emulador da WING
        run: (cd emulador && MESA_SINAL_TESTE=1 node server.js > ../emulador.log 2>&1 &)
      - name: Testar o .apk num Android emulado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/testar-android.sh "$(ls dist/*.apk | head -1)"
      - name: Tela do Android no fim do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tela
          path: android-tela.png
          if-no-files-found: ignore

  publicar:
    needs: [mac, android-teste]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asa-mac-arm64
          path: saida
      - uses: actions/download-artifact@v4
        with:
          name: asa-android
          path: saida
      - name: Preparar a versao e as notas
        run: |
          versao="$(node -p "require('./package.json').version")"
          echo "TAG=v$versao" >> "$GITHUB_ENV"
          notas=".github/notas/v$versao.md"
          if [ -f "$notas" ]; then
            titulo="$(head -n 1 "$notas" | sed -n 's/^# //p')"
            echo "TITULO=${titulo:-Asa Edit $versao}" >> "$GITHUB_ENV"
            if [ -n "$titulo" ]; then tail -n +2 "$notas" > corpo.md; else cp "$notas" corpo.md; fi
          else
            echo "TITULO=Asa Edit $versao" >> "$GITHUB_ENV"
            echo "Instaladores do Asa Edit para Mac (Apple Silicon) e Android." > corpo.md
          fi
          printf '\n\n---\nMontado a partir de %s.\n' "${GITHUB_SHA::7}" >> corpo.md
          # A tag da versao acompanha o commit mais novo desta versao.
          git tag -f "v$versao"
          git push -f origin "refs/tags/v$versao"
      # A release da versao e' reaproveitada a cada push: tira os .dmg que nao
      # sao o desta montagem (ex.: um nome antigo), para nao baixarem o errado.
      - name: Tirar instaladores antigos da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          novos="$(ls saida | tr ' ' '.')"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | while read -r nome; do
            case "$nome" in
              *.dmg|*.apk) echo "$novos" | grep -qxF "$nome" || gh release delete-asset "$TAG" "$nome" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITULO }}
          body_path: corpo.md
          files: |
            saida/*.dmg
            saida/*.apk
          make_latest: true
